<main>
<h1>Part 1. Basic HTML Forms</h1>
<section class="panel" id="task0">
<h2>Task 0. Simple Contact Form</h2>
<form action="#" method="get" class="plain">
<label for="name0">Name</label>
<input type="text" id="name0" name="name">
<label for="email0">Email</label>
<input type="email" id="email0" name="email">
<label for="message0">Message</label>
<textarea id="message0" name="message" rows="5"></textarea>
<button type="submit">Submit</button>
</form>
</section>
<section class="panel" id="task1">
<h2>Task 1. Form with HTML5 Validation</h2>
<form action="#" method="get" class="plain">
<label for="name1">Name</label>
<input type="text" id="name1" name="name" required minlength="2" maxlength="40">
<label for="email1">Email</label>
<input type="email" id="email1" name="email" required>
<label for="message1">Message</label>
<textarea id="message1" name="message" rows="5" required minlength="10" maxlength="300"></textarea>
<button type="submit">Submit</button>
</form>
</section>
</main>
